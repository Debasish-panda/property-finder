quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:property_finder}
quarkus.datasource.password=${DB_PASSWORD:property_finder}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/property_finder}
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:86400}
app.otp.ttl-seconds=${APP_OTP_TTL_SECONDS:300}
app.otp.log-in-development=${APP_OTP_LOG:true}
