<div class="pin-wrap" [style.top]="property().position.top" [style.left]="property().position.left" (mouseenter)="hovered.set(true)" (mouseleave)="hovered.set(false)"><button class="map-pin" type="button" [attr.aria-label]="'Show details for ' + property().title" [class.active]="hovered()">{{ property().rent }}</button>@if (hovered()) { <app-property-popup class="pin-popup" [property]="property()" /> }</div>
